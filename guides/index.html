ns are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod manage","c":"AutoMod","d":"This opens the filter-management panel, where staff can turn individual AutoMod checks on or off. It gives the server control over which kinds of message behaviour should be moderated instead of forcing every filter to be active.","u":"{p}automod manage","ex":["{p}automod manage"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["filters","toggle"],"k":[],"i":"This opens the filter-management panel, where staff can turn individual AutoMod checks on or off. It gives the server control over which kinds of message behaviour should be moderated instead of forcing every filter to be active.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod reset","c":"AutoMod","d":"This resets the AutoMod configuration for the server. Treat it as a full configuration reset: review the current settings first, because you may need to enable filters and set preferred options again afterward.","u":"{p}automod reset","ex":["{p}automod reset"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["This is a big action. Read it twice before you press enter.","Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This resets the AutoMod configuration for the server. Treat it as a full configuration reset: review the current settings first, because you may need to enable filters and set preferred options again afterward.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod rules","c":"AutoMod","d":"This displays the rule descriptions for the available AutoMod filters. It helps moderators understand what each filter is intended to catch before deciding which ones fit their community.","u":"{p}automod rules","ex":["{p}automod rules"],"ar":[],"w":"Everyone can use it","nt":["Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This displays the rule descriptions for the available AutoMod filters. It helps moderators understand what each filter is intended to catch before deciding which ones fit their community.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod settings","c":"AutoMod","d":"This opens the AutoMod settings view, including the configured moderation response and sensitivity-related values for the filters. It is a review screen for understanding how the active setup is configured.","u":"{p}automod settings","ex":["{p}automod settings"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["config","panel"],"k":[],"i":"This opens the AutoMod settings view, including the configured moderation response and sensitivity-related values for the filters. It is a review screen for understanding how the active setup is configured.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod whitelist","c":"AutoMod","d":"The AutoMod whitelist is an exception list for selected roles and channels. It tells AutoMod where or for whom its message filters should be skipped, which helps trusted staff spaces and special-purpose channels operate without unwanted automated moderation.","u":"{p}automod whitelist","ex":["{p}automod whitelist"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["wl","ignore"],"k":["automod whitelist channel","automod whitelist reset","automod whitelist role","automod whitelist show"],"i":"The AutoMod whitelist is an exception list for selected roles and channels. It tells AutoMod where or for whom its message filters should be skipped, which helps trusted staff spaces and special-purpose channels operate without unwanted automated moderation.","h":"A whitelist creates controlled exceptions to automatic message checks. It does not make a member a moderator or grant new Discord permissions; it simply tells AutoMod not to apply its configured checks to the selected role or channel.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, you may want AutoMod to check public chat but leave a private staff channel alone. Whitelisting that channel creates an exception for the location, not a new permission for the people inside it.","sec":true},{"n":"automod whitelist channel","c":"AutoMod","d":"This adds a text channel to the AutoMod whitelist. Messages in that channel are excluded from the AutoMod checks, which can be useful for a bot-command channel or a staff workspace where normal conversation rules differ.","u":"{p}automod whitelist channel <channel>","ex":["{p}automod whitelist channel #general"],"ar":[["channel","The channel. Mention it (#general) or paste its ID."]],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This adds a text channel to the AutoMod whitelist. Messages in that channel are excluded from the AutoMod checks, which can be useful for a bot-command channel or a staff workspace where normal conversation rules differ.","h":"This exempts the selected channel from AutoMod checks. It is useful for a staff discussion or bot-command area, but public channels should not be exempted unless there is a clear moderation reason.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod whitelist reset","c":"AutoMod","d":"This resets the AutoMod whitelist by clearing the saved exceptions. Afterward, the system no longer skips the previously whitelisted roles or channels, so enabled filters can apply there as well.","u":"{p}automod whitelist reset","ex":["{p}automod whitelist reset"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["This is a big action. Read it twice before you press enter.","Works inside a server only, not in direct messages."],"st":[],"a":["clear"],"k":[],"i":"This resets the AutoMod whitelist by clearing the saved exceptions. Afterward, the system no longer skips the previously whitelisted roles or channels, so enabled filters can apply there as well.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod whitelist role","c":"AutoMod","d":"This adds a role to the AutoMod whitelist. Members with that role are treated as exempt from the AutoMod message checks, which can reduce unwanted moderation of trusted staff or approved service accounts.","u":"{p}automod whitelist role <role>","ex":["{p}automod whitelist role @Member"],"ar":[["role","The role. Mention it (@Member) or type its name."]],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This adds a role to the AutoMod whitelist. Members with that role are treated as exempt from the AutoMod message checks, which can reduce unwanted moderation of trusted staff or approved service accounts.","h":"Members with this role are skipped by the AutoMod checks covered by the whitelist. Only use it for roles whose messages should genuinely be exempt, because the exemption can include every member who has that role.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"automod whitelist show","c":"AutoMod","d":"This displays the current AutoMod whitelist settings, including the saved role and channel exceptions. Use it to review who or which spaces are excluded before making further changes.","u":"{p}automod whitelist show","ex":["{p}automod whitelist show"],"ar":[],"w":"The server owner, or people the owner trusts","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["list","view"],"k":[],"i":"This displays the current AutoMod whitelist settings, including the saved role and channel exceptions. Use it to review who or which spaces are excluded before making further changes.","h":"AutoMod checks messages using the filters that administrators have enabled. Depending on the selected filter settings, a matching message can be removed or receive the configured moderation response. Whitelisted roles and channels are exceptions, while the blacklist supplies words and phrases for its dedicated filter.","v":"It helps staff maintain community rules around the clock and reduces the amount of repetitive message cleanup moderators must do. Review filters and exceptions carefully so useful conversations are not caught unnecessarily.","sc":"For example, a community can enable the filters it needs, add prohibited phrases to the blacklist, and exempt a staff-only channel if staff need to discuss moderation cases there.","sec":true},{"n":"channel clone","c":"Channels","d":"This creates a copy of a channel using the selected channel as the template. The new channel can retain much of the original channel setup, making it faster to create another space with a similar layout.","u":"{p}channel clone [channel]","ex":["{p}channel clone #support"],"ar":[["channel (optional)","The channel. Mention it (#general) or paste its ID."]],"w":"You need: Manage Channels","nt":["The bot also needs: Manage Channels."],"st":[],"a":[],"k":[],"i":"This creates a copy of a channel using the selected channel as the template. The new channel can retain much of the original channel setup, making it faster to create another space with a similar layout.","h":"The channel commands make changes to Discord text channels through the bot. Creating, cloning, renaming, moving, or deleting a channel changes the server’s channel layout; check the selected channel and category before using a destructive action.","v":"It helps staff organize the server without repeating the same manual setup in Discord. Use it to create a consistent layout, keep related spaces together, and remove channels that are no longer needed.","sc":"For example, create #applications for a new recruitment round, clone an existing support channel for a second team, or move a discussion channel into the correct category.","sec":false},{"n":"channel create","c":"Channels","d":"This creates a new text channel in the server. Use it when you need a separate place for announcements, support, discussion, applications, or another community activity.","u":"{p}channel create [name]","ex":["{p}channel create applications"],"ar":[["name (optional)","Some text. Type it after the command."]],"w":"You need: Manage Channels","nt":["The bot also needs: Manage Channels."],"st":[],"a":[],"k":[],"i":"This creates a new text channel in the server. Use it when you need a separate place for announcements, support, discussion, applications, or another community activity.","h":"The channel commands make changes to Discord text channels through the bot. Creating, cloning, renaming, moving, or deleting a channel changes the server’s channel layout; check the selected channel and category before using a destructive action.","v":"It helps staff organize the server without repeating the same manual setup in Discord. Use it to create a consistent layout, keep related spaces together, and remove channels that are no longer needed.","sc":"For example, create #applications for a new recruitment round, clone an existing support channel for a second team, or move a discussion channel into the correct category.","sec":false},{"n":"channel delete","c":"Channels","d":"This deletes the selected text channel from the server. Deletion removes that channel, so check the channel name and any important content before confirming the action.","u":"{p}channel delete [channel]","ex":["{p}channel delete #old-chat"],"ar":[["channel (optional)","The channel. Mention it (#general) or paste its ID."]],"w":"You need: Manage Channels","nt":["The bot also needs: Manage Channels."],"st":[],"a":[],"k":[],"i":"This deletes the selected text channel from the server. Deletion removes that channel, so check the channel name and any important content before confirming the action.","h":"The channel commands make changes to Discord text channels through the bot. Creating, cloning, renaming, moving, or deleting a channel changes the server’s channel layout; check the selected channel and category before using a destructive action.","v":"It helps staff organize the server without repeating the same manual setup in Discord. Use it to create a consistent layout, keep related spaces together, and remove channels that are no longer needed.","sc":"For example, create #applications for a new recruitment round, clone an existing support channel for a second team, or move a discussion channel into the correct category.","sec":false},{"n":"channel rename","c":"Channels","d":"This changes the name of the current text channel. It is useful when a channel’s purpose changes and you want its name to match the new topic.","u":"{p}channel rename [name]","ex":["{p}channel rename community-chat"],"ar":[["name (optional)","Some text. Type it after the command."]],"w":"You need: Manage Channels","nt":["The bot also needs: Manage Channels."],"st":[],"a":[],"k":[],"i":"This changes the name of the current text channel. It is useful when a channel’s purpose changes and you want its name to match the new topic.","h":"The channel commands make changes to Discord text channels through the bot. Creating, cloning, renaming, moving, or deleting a channel changes the server’s channel layout; check the selected channel and category before using a destructive action.","v":"It helps staff organize the server without repeating the same manual setup in Discord. Use it to create a consistent layout, keep related spaces together, and remove channels that are no longer needed.","sc":"For example, create #applications for a new recruitment round, clone an existing support channel for a second team, or move a discussion channel into the correct category.","sec":false},{"n":"channel transfer","c":"Channels","d":"This moves a channel into a different server category. The channel itself remains the same; this command changes where it appears in the server’s channel list.","u":"{p}channel transfer [channel] [category]","ex":["{p}channel transfer #support Support"],"ar":[["channel (optional)","The channel. Mention it (#general) or paste its ID."],["category (optional)","The channel. Mention it (#general) or paste its ID."]],"w":"You need: Manage Channels","nt":["The bot also needs: Manage Channels."],"st":[],"a":[],"k":[],"i":"This moves a channel into a different server category. The channel itself remains the same; this command changes where it appears in the server’s channel list.","h":"The channel commands make changes to Discord text channels through the bot. Creating, cloning, renaming, moving, or deleting a channel changes the server’s channel layout; check the selected channel and category before using a destructive action.","v":"It helps staff organize the server without repeating the same manual setup in Discord. Use it to create a consistent layout, keep related spaces together, and remove channels that are no longer needed.","sc":"For example, create #applications for a new recruitment round, clone an existing support channel for a second team, or move a discussion channel into the correct category.","sec":false},{"n":"bbanner","c":"Custom Bot","d":"This changes the bot’s server-specific banner for the current Discord server. You can provide an image URL or attach an image, allowing the bot’s profile to match the identity of this community without changing its appearance in every other server.","u":"{p}bbanner [url]","ex":["{p}bbanner https://example.com/server-banner.png","{p}bbanner none  → Reset the server banner"],"ar":[["url (optional)","Some text. Type it after the command."]],"w":"Everyone can use it","nt":["Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This changes the bot’s server-specific banner for the current Discord server. You can provide an image URL or attach an image, allowing the bot’s profile to match the identity of this community without changing its appearance in every other server.","h":"These settings apply to the bot’s profile within the current server, rather than changing the bot’s appearance everywhere. Administrators can tailor supported profile details for each community. Discord availability and the bot account’s supported profile features still apply.","v":"A server-specific profile makes the bot feel like part of the community while keeping other servers’ customizations independent. Use consistent imagery and a short bio so members know what the bot is for.","sc":"For example, a gaming community can give the bot a matching server avatar and a short bio such as “Community tools and moderation support”, while another server keeps a different profile.","sec":false},{"n":"bbio","c":"Custom Bot","d":"This updates the bot’s server-specific profile biography for the current server. It gives the bot a short description that can explain its role in this community; use “none” to clear the custom bio.","u":"{p}bbio [text]","ex":["{p}bbio Community tools and moderation support","{p}bbio none  → Clear the custom server bio"],"ar":[["text (optional)","Some text. Type it after the command."]],"w":"Everyone can use it","nt":["Works inside a server only, not in direct messages."],"st":[],"a":[],"k":[],"i":"This updates the bot’s server-specific profile biography for the current server. It gives the bot a short descripti d a short bio such as “Community tools and moderation support”, while another server keeps a different profile.","sec":false},{"n":"bpfp","c":"Custom Bot","d":"This changes the bot’s server-specific avatar for the current server. Provide an image URL or attach an image to give the bot a recognizable local identity; use “none” to reset the custom avatar.","u":"{p}bpfp [url]","ex":["{p}bpfp https://example.com/bot-avatar.png","{p}bpfp none  → Reset the server avatar"],"ar":[["url (optional)","Some text. Type it after the command."]],"w":"Everyone can use it","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["bavatar"],"k":[],"i":"This changes the bot’s server-specific avatar for the current server. Provide an image URL or attach an image to give the bot a recognizable local identity; use “none” to reset the custom avatar.","h":"These settings apply to the bot’s profile within the current server, rather than changing the bot’s appearance everywhere. Administrators can tailor supported profile details for each community. Discord availability and the bot account’s supported profile features still apply.","v":"A server-specific profile makes the bot feel like part of the community while keeping other servers’ customizations independent. Use consistent imagery and a short bio so members know what the bot is for.","sc":"For example, a gaming community can give the bot a matching server avatar and a short bio such as “Community tools and moderation support”, while another server keeps a different profile.","sec":false},{"n":"custombot","c":"Custom Bot","d":"This opens the per-server CustomBot settings panel. Administrators can customize supported parts of the bot’s profile and presentation for their own server, while other servers can keep their own independent settings.","u":"{p}custombot","ex":["{p}custombot  → Open the per-server customization panel"],"ar":[],"w":"You need: Administrator","nt":["Works inside a server only, not in direct messages."],"st":[],"a":["cb"],"k":[],"i":"This opens the per-server CustomBot settings panel. Administrators can customize supported parts of the bot’s profile and presentation for their own server, while other servers can keep their own independent settings.","h":"These settings apply to the bot’s profile within the current server, rather than changing the bot’s appearance everywhere. Administrators can tailor supported profile details for each community. Discord availability and the bot account’s supported profile features still apply.","v":"A server-specific profile makes the bot feel like part of the community while keeping other servers’ customizations independent. Use consistent imagery and a short bio so members know what the bot is for.","sc":"For example, a gaming community can give the bot a matching server avatar and a short bio such as “Community tools and moderation support”, while another server keeps a different profile.","sec":false},{"n":"embed","c":"Embeds","d":"This is the entry point for the embed builder. It opens the available embed tools so staff can create a formatted message with a title, description, accent colour, thumbnail, and footer instead of sending plain text.","u":"{p}embed","ex":["{p}embed"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":[],"k":["embed create"],"i":"This is the entry point for the embed builder. It opens the available embed tools so staff can create a formatted message with a title, description, accent colour, thumbnail, and footer instead of sending plain text.","h":"The builder collects the content and appearance choices in an interactive form, then posts the formatted message in the channel where it was opened. It is intended for clear announcements, information panels, and other structured messages.","v":"Structured messages make rules, announcements, and instructions easier to scan. A title, description, colour, and thumbnail can turn a long plain-text post into a clearer information card.","sc":"For exampl y 3 are deleted.","If you do not give a number, the bot uses 100. The number must be 1 to 1000.","Messages older than 14 days may not be deleted by Discord.","Go slowly: start with a small number like 10.","The bot needs the Manage Messages permission."],"st":["Type the command, then the person, then how many messages to check.","You can mention them or paste their user ID."],"a":["purgeuser"],"k":[],"i":"This deletes recent messages written by one selected member and leaves messages from everyone else in place. You can choose how far back the bot should check.","h":"Purge commands inspect recent messages in the channel where they are run and delete only messages that match the selected filter. The amount controls how far back the bot checks; Discord’s message-age rules and the bot’s permissions still apply.","v":"Targeted cleanup saves time and avoids deleting unrelated conversation. Choose the smallest useful amount and the right filter before removing messages.","sc":"For example, use clear 20 to remove a small batch of recent messages, or clearuser @Member 50 to remove that member’s messages within the last 50 messages checked.","sec":false},{"n":"reactionrole","c":"Reaction Roles","d":"Reaction Roles connect an emoji on a chosen message to a Discord role. Members can react to the configured message to receive the linked role, and removing their reaction removes that role again.","u":"{p}reactionrole","ex":["{p}reactionrole","{p}rr add <message_id> <emoji> <role>  → Bind emoji to role","{p}rr remove <message_id> <emoji>  → Remove binding","{p}rr list  → List all reaction roles","{p}rr clear <message_id>  → Clear all roles on a message"],"ar":[],"w":"You need: Manage Roles","nt":[],"st":[],"a":["rr"],"k":["reactionrole add","reactionrole clear","reactionrole list","reactionrole remove"],"i":"Reaction Roles connect an emoji on a chosen message to a Discord role. Members can react to the configured message to receive the linked role, and removing their reaction removes that role again.","h":"The bot stores a connection between a message, an emoji, and a role. When a member adds or removes the configured reaction, the reaction-role listener updates that member’s role accordingly.","v":"Members can choose their own notification, event, or interest roles without waiting for staff. It also keeps role assignment consistent because the reaction is tied to a defined mapping.","sc":"For example, connect 🎮 on a “Choose your games” message to @Gamer. A member who reacts can receive @Gamer, and removing the reaction removes the role again.","sec":false},{"n":"reactionrole add","c":"Reaction Roles","d":"This links one emoji on a message to one role. Once saved, members who add that reaction can receive the selected role, and the reaction-role listener can remove it again when the reaction is removed.","u":"{p}reactionrole add <message_id> <emoji> <role>","ex":["{p}reactionrole add 123456789012345678 🎮 @Gamer"],"ar":[["message_id","A number, like 10."],["emoji","Some text. Type it after the command."],["role","The role. Mention it (@Member) or type its name."]],"w":"You need: Manage Roles","nt":[],"st":[],"a":[],"k":[],"i":"This links one emoji on a message to one role. Once saved, members who add that reaction can receive the selected role, and the reaction-role listener can remove it again when the reaction is removed.","h":"The bot stores a connection between a message, an emoji, and a role. When a member adds or removes the configured reaction, the reaction-role listener updates that member’s role accordingly.","v":"Members can choose their own notification, event, or interest roles without waiting for staff. It also keeps role assignment consistent because the reaction is tied to a defined mapping.","sc":"For example, connect 🎮 on a “Choose your games” message to @Gamer. A member who reacts can receive @Gamer, and removing the reaction removes the role again.","sec":false},{"n":"reactionrole clear","c":"Reaction Roles","d":"This remo me-message style. It is the main greeting text sent when a new member joins while simple mode is selected.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet setup","c":"Welcome","d":"This starts the guided welcome setup. It walks an administrator through the basic choices needed to enable a welcome channel and choose the message style.","u":"{p}greet setup","ex":["{p}greet setup"],"ar":[],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This starts the guided welcome setup. It walks an administrator through the basic choices needed to enable a welcome channel and choose the message style.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet test","c":"Welcome","d":"This sends a preview of the currently configured welcome message without waiting for a new member to join. It lets staff check the wording and appearance before enabling it for everyone.","u":"{p}greet test","ex":["{p}greet test"],"ar":[],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This sends a preview of the currently configured welcome message without waiting for a new member to join. It lets staff check the wording and appearance before enabling it for everyone.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet thumbnail","c":"Welcome","d":"This sets the small thumbnail image displayed in the container-style welcome card. It can be used for a server icon, community logo, or other compact visual.","u":"{p}greet thumbnail <url>","ex":["{p}greet thumbnail https://example.com/server-icon.png"],"ar":[["url","Some text. Type it after the command."]],"w":"You need: Administrator","nt":[],"st":[],"a":["thumb"],"k":[],"i":"This sets the small thumbnail image displayed in the container-style welcome card. It can be used for a server icon, community logo, or other compact visual.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet title","c":"Welcome","d":"This sets the title displayed at the top of the container-style welcome card. Choose a short heading that makes the greeting easy to recognize.","u":"{p}greet title <title>","ex":["{p}greet title Welcome aboard!"],"ar":[["title","Some text. Type it after the command."]],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This sets the title displayed at the top of the container-style welcome card. Choose a short heading that makes the greeting easy to recognize.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet type","c":"Welcome","d":"This chooses the welcome-message layout: simple text or a richer container-style card. Use simple mode for a lightweight greeting, or container mode when you want a more designed welcome panel.","u":"{p}greet type <mode>","ex":["{p}greet type container","{p}greet type simple"],"ar":[["mode","Some text. Type it after the command."]],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This chooses the welcome-message layout: simple text or a richer container-style card. Use simple mode for a lightweight greeting, or container mode when you want a more designed welcome panel.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false},{"n":"greet variables","c":"Welcome","d":"This lists the template variables supported by the welcome-message system. These placeholders can insert member or server information into the message so each greeting feels relevant to the person joining.","u":"{p}greet variables","ex":["{p}greet variables"],"ar":[],"w":"Everyone can use it","nt":[],"st":[],"a":["vars"],"k":[],"i":"This lists the template variables supported by the welcome-message system. These placeholders can insert member or server information into the message so each greeting feels relevant to the person joining.","h":"When a new member joins, the bot uses the saved welcome settings to send the selected message style in the configured channel. The test command previews the current design so administrators can check it before relying on it for real joins.","v":"A clear welcome message helps new members know they have arrived in the right place and can point them toward the next step. Testing the layout first prevents confusing or unfinished greetings.","sc":"For example, send new members a welcome card in #welcome with the server logo, a short greeting, and a reminder to read #rules. Use the test command to preview the card before members see it.","sec":false}],G=[{"id":"g-prefix","t":"What is a prefix?","s":["A prefix is a small sign you type before a command. It tells the bot: “this is a command”.","If the prefix is {p}, then you type:","$ {p}help","Change it (you need the Administrator permission):","$ {p}setprefix !","Go back to the first prefix:","$ {p}resetprefix","See the current prefix:","$ {p}prefix","Tip: on the home page, type your own prefix in the box. Every example on this site will change."]},{"id":"g-antinuke","t":"Turn on Antinuke, step by step","s":["## What Antinuke is for","Antinuke adds an extra layer of protection around important server actions. It is designed for communities that want safeguards against suspicious or destructive activity, such as unexpected changes to channels, roles, or member access.","## How it helps protect your server","You choose the protection areas that matter to your server. The bot watches the selected areas and can respond when activity is considered dangerous. A dedicated security-log channel gives the owner and staff a place to review alerts.","Antinuke is a safety layer, not a replacement for careful staff selection, secure accounts, or sensible Discord permissions. Keep the bot’s security roles intact and only give security-management access to people you trust.","## Set it up","STEP 1. Enable the feature:","$ {p}antinuke enable","Wait for the setup to finish. The bot prepares the security roles it needs. Do not remove or edit those roles while Antinuke is in use.","STEP 2. Choose what to protect:","$ {p}antinuke filters","Use the buttons to select the protection areas your server needs. Enabling Antinuke alone does not choose the filters for you.","For a faster starting setup, use the wizard and then review the filter panel:","$ {p}antinuke wizard","STEP 3. Choose a private channel for alerts:","$ {p}antinuke logs #security-logs","STEP 4. Review who is trusted. Read the Whitelist guide before adding anyone:","$ {p}antinuke wl @Ahmed","STEP 5. Check the saved trusted list:","$ {p}antinuke wlist","## Important","Only the server owner or an extra owner can manage Antinuke. Review the selected filters, trusted entries, and alert channel whenever staff roles or server responsibilities change."]},{"id":"g-wl","t":"What does WL mean?","s":["## What WL means","WL stands for Whitelist. In Antinuke, it is a trusted list for members, bots, or roles that need to perform selected administrative actions without being treated like an unapproved actor for those actions.","## How the whitelist helps","A whitelist helps balance security with normal server management. For example, your head moderator may need to ban rule-breakers, while they do not need permission to make sensitive channel or role changes. You can approve only the action types that match their responsibility.","The whitelist does not grant Discord permissions and does not make someone a server owner. It records which actions Antinuke should treat as trusted for that target. Only add people and bots you genuinely trust.","## Add a trusted person, bot, or role","$ {p}antinuke wl @Ahmed","A selection panel opens. Choose only the actions that person or role is responsible for. Repeat the process for a bot or a role when needed:","$ {p}antinuke wl @SomeBot","$ {p}antinuke wl @Moderator","## Review or remove access","See the current trusted entries:","$ {p}antinuke wlist","Remove one target when they no longer need trusted access:","$ {p}antinuke unwl @Ahmed","Clear all trusted entries only when you intentionally want to remove every whitelist exception:","$ {p}antinuke wlreset","## Keep the list small","Only whitelist people and bots whose accounts and responsibilities are trusted. If a trusted account is compromised, someone else may be able to use the access it already has. Review the list regularly."]},{"id":"g-extra","t":"What is an Extra Owner?","s":["An extra owner is a second person who can manage Antinuke and the whitelist, like the server owner. Choose very carefully.","Add one:","$ {p}extraowner set @Ahmed","See all extra owners:","$ {p}extraowner view","Remove one:","$ {p}extraowner reset @Ahmed","Remove all of them:","$ {p}extraowner clear"]},{"id":"g-purge","t":"Delete messages safely (purge)","s":["Purge means deleting many messages at once. The main command is clear. Its other names are purge and clean.","STEP 1. Go to the channel you want to clean.","STEP 2. Type the command and a number. The number is how many recent messages to delete (1 to 1000):","$ {p}clear 20","Start small. Use 10 or 20 first. Look at the result. Then do more if you need.","Delete messages from one person only. Mention them or paste their user ID:","$ {p}clearuser @Ahmed 50","$ {p}clearuser 123456789012345678 50","Here 50 means the bot looks at the last 50 messages. Only Ahmed’s messages inside them are deleted.","Other useful ones:","$ {p}clearbots 30","$ {p}clearimages 30","$ {p}clearcontain discord.gg","To get a user ID: in Discord open Settings, then Advanced, then turn on Developer Mode. Then press and hold a person and choose Copy User ID.","Good to know: you need the Manage Messages permission, and the bot needs it too. Discord may not delete messages older than 14 days."]},{"id":"g-mistakes","t":"Why does it not work? (common mistakes)","s":["1. “I typed antinuke enable but nothing is protected.” You must also open {p}antinuke filters and turn the filters ON.","2. “The bot does not answer.” Check the prefix. Ask a server admin, or type your prefix in the box on the home page of this site.","3. “Missing permissions.” Give the bot the Administrator permission, and put the bot’s role high in the role list.","4. “I cannot use Antinuke commands.” Only the server owner and extra owners can.","5. “The security roles are gone.” Someone removed them. Run {p}antinuke disable, then {p}antinuke enable again."]}];
let P="+";try{P=localStorage.getItem("ap2")||"+"}catch(e){}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=t=>esc(t).split("{p}").join(esc(P));
const slug=n=>"c-"+n.replace(/[^a-z0-9]+/g,"-");
const cats=["All",...[...new Set(D.map(x=>x.c))]];let cat="All",q="";

const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:"";
function home(){app.innerHTML=`<h2>Welcome to Atom Guide</h2><p class="mu">A complete command library with clear explanations, practical server examples, and step-by-step guidance.</p>
<div class="card"><b>Your prefix</b><p class="mu" style="margin:4px 0 8px">Type the sign your server uses before commands. All examples on this site will change.</p><input id="pi" maxlength="3" value="${esc(P)}"></div>
<a class="btn" href="#all">View All Command Guides (${D.length})</a><h3>Start here</h3>
${G.map(g=>`<button class="g" onclick="location.hash='${g.id}'">${esc(g.t)}</button>`).join("")}`;
document.getElementById("pi").oninput=e=>{P=e.target.value||"+";try{localStorage.setItem("ap2",P)}catch(x){}}}
function list(){app.innerHTML=`<button class="bk" onclick="location.hash=''">&larr; Home</button><h2>All Commands</h2>
<input id="qi" placeholder="Search a command…" value="${esc(q)}"><div class="chips">${cats.map(c=>`<button class="${c==cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="ls"></div>`;
app.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;list()});
document.getElementById("qi").oninput=e=>{q=e.target.value;fill()};fill()}
function fill(){const k=q.trim().toLowerCase();const r=D.filter(x=>(cat=="All"||x.c==cat)&&(!k||[x.n,x.d,x.i,x.h,x.v].filter(Boolean).some(t=>t.toLowerCase().includes(k))));
document.getElementById("ls").innerHTML=r.map(x=>`<button class="g" onclick="location.hash='${slug(x.n)}'"><b>${f("{p}")+esc(x.n)}</b><span>${esc(x.d)}</span></button>`).join("")||'<p class="mu">Nothing found.</p>'}
function detail(x){const L=a=>a.map(s=>`<li>${f(s)}</li>`).join("");
app.innerHTML=`<button class="bk" onclick="history.back()">&larr; Back</button><h2>${f("{p}")+esc(x.n)}</h2><span class="detail-category">${esc(x.c)}</span>
<div class="detail-intro"><h3>What it does</h3><p>${f(x.i||x.d)}</p></div>
<div class="detail-panel ${x.sec?'important':''}"><h3>${x.sec?'How it helps protect your server':'How it works in your server'}</h3><p>${esc(x.h||'The command follows the settings and permissions already configured for this server, then reports the result in Discord.')}</p></div>
<div class="detail-panel"><h3>Why this is useful</h3><p>${esc(x.v||'It makes this task easier to manage consistently inside your server.')}</p></div>
<div class="detail-panel example"><h3>Example in a real server</h3><p>${f(x.sc||'Use the example below as a starting point, then replace the sample channel, member, or role with the one from your server.')}</p></div>
${sec("Step by step",x.st.length?`<ol>${L(x.st)}</ol>`:"")}
${sec("How to type it",`<pre>${f(x.u)}</pre>`)}${sec("What each part means",x.ar.length?`<ul>${x.ar.map(a=>`<li><b>${esc(a[0])}</b>: ${esc(a[1])}</li>`).join("")}</ul>`:"")}
${sec("Examples",`<pre>${x.ex.map(f).join("\n")}</pre>`)}${sec("Who can use it",`<p>${esc(x.w)}</p>`)}
${sec("Good to know",x.nt.length?`<ul>${L(x.nt)}</ul>`:"")}${sec("Other names",x.a.length?`<p>${x.a.map(a=>`<code>${f("{p}")+esc(a)}</code>`).join(" ")}</p>`:"")}
${sec("Commands inside this one",x.k.length?x.k.map(k=>`<button class="g" onclick="location.hash='${slug(k)}'">${f("{p}")+esc(k)}</button>`).join(""):"")}`}
function guide(g){app.innerHTML=`<button class="bk" onclick="history.back()">&larr; Back</button><h2>${esc(g.t)}</h2>${g.s.map(s=>s.startsWith("$ ")?`<pre>${f(s.slice(2))}</pre>`:s.startsWith("## ")?`<h3>${esc(s.slice(3))}</h3>`:`<p>${f(s)}</p>`).join("")}`}
function route(){const h=location.hash.slice(1);scrollTo(0,0);if(!h)return home();if(h=="all")return list();
const g=G.find(x=>x.id==h);if(g)return guide(g);const x=D.find(y=>slug(y.n)==h);x?detail(x):home()}
addEventListener("hashchange",route);route();
</script></body></html>
