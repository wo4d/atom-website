<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Atom Guides — Atomic Development</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080909">
<meta name="description" content="Explore clear, practical guides for every Atom Discord bot command.">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070809;--card:#101214;--card2:#151719;--tx:#f4f5f6;--mu:#a0a6ac;--ac:#ff6b35;--ac2:#ff9c57;--bd:rgba(255,255,255,.09);--line:rgba(255,255,255,.07);--gold:#ffb36a}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(255,105,53,.09),transparent 34%),radial-gradient(ellipse at 92% 34%,rgba(255,154,78,.045),transparent 32%),var(--bg);color:var(--tx);font:15.5px/1.68 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.w{max-width:900px;margin:0 auto;padding:22px 20px 46px}
/* Premium entrance */
#sp{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,rgba(255,105,49,.16),transparent 42%),radial-gradient(ellipse at 10% 10%,rgba(255,166,90,.09),transparent 34%),linear-gradient(145deg,#080909 0%,#0b0d0f 48%,#080808 100%);color:#fff;text-align:center;transition:opacity .65s ease,visibility .65s ease}
#sp::before{content:"";position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,black,transparent 88%);pointer-events:none}
#sp.o{opacity:0;visibility:hidden;pointer-events:none}
.entry-orbit{position:absolute;border:1px solid rgba(255,143,82,.13);border-radius:50%;pointer-events:none;transform:rotate(-24deg)}
.entry-orbit-one{width:min(90vw,760px);height:min(90vw,760px);max-height:80vh;max-width:80vh}
.entry-orbit-two{width:min(70vw,580px);height:min(70vw,580px);max-height:60vh;max-width:60vh;border-color:rgba(255,255,255,.075);transform:rotate(38deg)}
.entry-card{position:relative;width:min(100%,560px);padding:34px 38px 30px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(150deg,rgba(24,26,28,.94),rgba(12,13,14,.88));box-shadow:0 32px 110px rgba(0,0,0,.55),0 0 70px rgba(255,100,45,.09),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-align:left}
.entry-brand{display:flex;align-items:center;gap:12px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.09)}
.entry-brand img{width:48px;height:48px;object-fit:cover;border-radius:15px;box-shadow:0 0 32px rgba(255,100,45,.22)}
.entry-brand-copy{display:flex;flex-direction:column;gap:2px;letter-spacing:.12em;font-size:11px;font-weight:800;color:#f5f5f5}
.entry-brand-copy small{font-size:9px;letter-spacing:.17em;color:#92979c;font-weight:600}
.entry-kicker{display:flex;align-items:center;gap:9px;margin-top:34px;color:#ffad76;font-size:10px;font-weight:800;letter-spacing:.2em}
.entry-kicker span{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px rgba(255,107,53,.9)}
#sp h1{margin:12px 0 10px;font-size:clamp(38px,8vw,58px);line-height:1.03;letter-spacing:.075em;font-weight:850}
#sp h1 em{font-style:normal;color:var(--ac2)}
.entry-description{max-width:425px;margin:0;color:#b9bec2;font-size:14px;line-height:1.8}
.entry-metrics{display:flex;align-items:center;gap:18px;margin:28px 0 27px;padding:17px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.entry-metrics div{display:flex;flex-direction:column;gap:1px}.entry-metrics b{font-size:21px;line-height:1.2;color:#fff;font-weight:750}.entry-metrics span{font-size:8px;white-space:nowrap;letter-spacing:.14em;color:#8d9499;font-weight:800}.entry-metrics i{height:25px;width:1px;background:rgba(255,255,255,.11)}
.entry-button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid rgba(255,161,106,.45);border-radius:13px;background:linear-gradient(105deg,#ff7139,#ff9752);color:#17100c;font-family:inherit;font-size:11px;line-height:1;font-weight:800;letter-spacing:.17em;cursor:pointer;box-shadow:0 12px 34px rgba(255,102,49,.18);transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}
.entry-button b{font-size:19px;font-weight:700}.entry-button:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 17px 38px rgba(255,102,49,.25)}.entry-button:focus-visible{outline:2px solid #fff;outline-offset:4px}
.entry-footnote{margin-top:17px;color:#858b90;font-size:8px;font-weight:800;letter-spacing:.16em}.entry-dot{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#75d49a;box-shadow:0 0 10px rgba(117,212,154,.7);vertical-align:1px}.entry-foot-sep{padding:0 5px;color:#555d63}.entry-bottom{position:absolute;left:24px;right:24px;bottom:18px;display:flex;justify-content:space-between;color:#6f767b;font-size:8px;font-weight:700;letter-spacing:.15em}
/* Main site */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,9,10,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top .w{display:flex;align-items:center;gap:11px;padding:12px 20px}.top img{width:36px;height:36px;border-radius:11px;box-shadow:0 0 22px rgba(255,100,45,.16)}.top b{letter-spacing:.11em;font-size:12px;font-weight:850}.top .w::after{content:"COMMAND KNOWLEDGE BASE";margin-left:auto;color:#7f878d;font-size:9px;letter-spacing:.16em;font-weight:700}
.card{background:linear-gradient(145deg,rgba(22,24,26,.94),rgba(15,17,18,.94));border:1px solid var(--bd);border-radius:17px;padding:18px;margin:13px 0;box-shadow:0 14px 35px rgba(0,0,0,.13)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid rgba(255,154,103,.34);border-radius:13px;padding:15px 18px;font-weight:800;color:#1a100b;background:linear-gradient(105deg,#ff7139,#ff9c58);text-align:center;text-decoration:none;box-shadow:0 10px 30px rgba(255,102,49,.12);transition:transform .2s ease,filter .2s ease}.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.g{display:block;width:100%;text-align:left;background:linear-gradient(145deg,rgba(20,22,24,.96),rgba(15,17,18,.94));border:1px solid var(--bd);border-radius:13px;padding:14px 16px;margin:9px 0;color:var(--tx);font:inherit;cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}.g:hover{border-color:rgba(255,123,67,.42);background:#17191b;transform:translateY(-1px)}
.g b{font-size:14px;font-weight:750}.g span{display:block;color:var(--mu);font-size:13px;line-height:1.55;margin-top:4px}.g:active{border-color:var(--ac)}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.35);color:var(--tx);font:inherit;outline:none}input:focus{border-color:rgba(255,125,67,.7);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:thin}.chips button{flex:none;border:1px solid var(--bd);background:#121416;color:#cbd0d3;border-radius:99px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:all .18s}.chips button:hover{border-color:rgba(255,123,67,.55)}.chips .on{background:rgba(255,107,53,.16);border-color:rgba(255,127,75,.65);color:#ffb18a}
pre{background:rgba(0,0,0,.48);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:11px;padding:13px 15px;overflow-x:auto;margin:10px 0;white-space:pre-wrap;word-break:break-word;font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e9d4c8}
h2{margin:7px 0 5px;font-size:clamp(24px,5vw,31px);line-height:1.2;letter-spacing:-.025em;font-weight:800}h3{margin:25px 0 8px;color:#ff9a69;font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:850}.mu{color:var(--mu)}
ol,ul{padding-left:22px;margin:8px 0}li{margin:7px 0;color:#d3d7da}.bk{border:0;background:none;color:#ff9868;font-family:inherit;font-size:13px;font-weight:750;cursor:pointer;padding:2px 0;margin-bottom:10px}.bk:hover{color:#ffc09b}
code{background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:#ffbf98;font: .92em ui-monospace,monospace}
/* Added command explanations */
.detail-category{display:inline-flex;align-items:center;gap:7px;margin:7px 0 10px;padding:5px 10px;border:1px solid rgba(255,140,91,.22);border-radius:99px;background:rgba(255,111,55,.08);color:#ffb48e;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detail-intro{padding:18px 19px;border:1px solid rgba(255,130,76,.21);border-radius:16px;background:linear-gradient(135deg,rgba(255,105,49,.10),rgba(255,255,255,.018) 62%);margin:13px 0 16px}
.detail-intro p,.detail-panel p{margin:0;color:#d4d8db;line-height:1.78;font-size:14px}
.detail-panel{padding:16px 18px;margin:12px 0;border:1px solid var(--line);border-radius:15px;background:rgba(17,19,21,.82)}
.detail-panel h3{margin:0 0 8px}.detail-panel.important{border-color:rgba(255,142,89,.25);background:linear-gradient(140deg,rgba(255,110,56,.075),rgba(17,19,21,.92))}
.detail-panel.example{border-color:rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(17,19,21,.92))}
.detail-section{margin:21px 0}.detail-section h3{margin:0 0 8px}.detail-section>p{margin:0;color:#d0d5d8}.detail-section .g{margin-top:8px}
#app>h2:first-of-type{margin-top:10px}#app>p.mu{max-width:650px;margin:5px 0 20px;font-size:14px}
@media(max-width:600px){.w{padding:17px 14px 34px}.top .w{padding:10px 14px}.top .w::after{font-size:7px;letter-spacing:.1em}.entry-card{padding:25px 22px 23px;border-radius:22px}.entry-brand{padding-bottom:18px}.entry-kicker{margin-top:27px;font-size:9px}.entry-description{font-size:13px}.entry-metrics{gap:11px;margin:22px 0}.entry-metrics b{font-size:19px}.entry-metrics span{font-size:7px;letter-spacing:.09em}.entry-bottom{font-size:7px;letter-spacing:.09em;bottom:12px}.entry-footnote{font-size:7px}.detail-intro{padding:15px}.detail-panel{padding:14px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<script>
const D=[{"n":"antinuke","c":"Antinuke","d":"The Antinuke command opens the security dashboard for this server. It gives the owner and approved extra owners a quick view of whether protection is enabled and which protection areas have been selected.","u":"{p}antinuke","ex":["{p}antinuke"],"ar":[],"w":"Only the server owner or an extra owner","nt":[],"st":["Type {p}antinuke to look at the panel.","To turn it on, read the Antinuke guide on the home page."],"a":["security","anti","an","antiraid","sec"],"k":["antinuke disable","antinuke enable","antinuke filters","antinuke help","antinuke logs","antinuke unwl","antinuke wizard","antinuke wl","antinuke wlist","antinuke wlreset"],"i":"The Antinuke command opens the security dashboard for this server. It gives the owner and approved extra owners a quick view of whether protection is enabled and which protection areas have been selected. It is the place to review the current setup before making changes.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"Imagine an account with access to the server begins making unexpected high-impact changes. Antinuke is designed to add a protective response around the server actions you chose to monitor, while the private log gives the owner and staff a place to review what happened.","sec":true},{"n":"antinuke disable","c":"Antinuke","d":"This turns Antinuke off for the server and clears its saved filter selections. While it is disabled, the Antinuke protection rules are not active.","u":"{p}antinuke disable","ex":["{p}antinuke disable"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["You must set the filters again if you turn it on later."],"st":["Type {p}antinuke disable.","Press confirm."],"a":[],"k":[],"i":"This turns Antinuke off for the server and clears its saved filter selections. While it is disabled, the Antinuke protection rules are not active. Use it only when you intentionally need to rebuild or stop the security setup.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke enable","c":"Antinuke","d":"This starts the server’s Antinuke protection setup. The bot prepares the security roles it needs and assigns them to itself, creating the foundation for the selected protection filters.","u":"{p}antinuke enable","ex":["{p}antinuke enable"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["Do not delete, edit or take away the 2 security roles. The bot will ban the person who does it, and your server owner gets a message."],"st":["The bot needs the Administrator permission.","Type {p}antinuke enable. Wait until all steps show a green tick.","Now open the filters: {p}antinuke filters. Turning it on is not enough!"],"a":[],"k":[],"i":"This starts the server’s Antinuke protection setup. The bot prepares the security roles it needs and assigns them to itself, creating the foundation for the selected protection filters. Enabling it is only the first setup step; you must also choose the filters you want active.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"A typical setup is to enable Antinuke first, confirm the setup completes, then open the filter panel and choose the protection areas your server needs. Do not assume protection is fully configured just because the enable command succeeded.","sec":true},{"n":"antinuke filters","c":"Antinuke","d":"This opens the interactive list of protection filters. Each filter represents a type of important server activity, such as member moderation or changes to channels and roles.","u":"{p}antinuke filters","ex":["{p}antinuke filters"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["Antinuke only guards what is turned ON.","Want everything fast? Use {p}antinuke wizard."],"st":["First run {p}antinuke enable.","Type {p}antinuke filters.","Press the buttons to turn each filter ON. Green means ON."],"a":["filter"],"k":[],"i":"This opens the interactive list of protection filters. Each filter represents a type of important server activity, such as member moderation or changes to channels and roles. You choose which areas Antinuke should watch, so the setup matches the way your server is managed.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a community that wants extra protection around channel and role changes can open this panel and enable those areas. The owner can return later to review or adjust the selection as the server changes.","sec":true},{"n":"antinuke help","c":"Antinuke","d":"This displays the Antinuke command reference inside Discord. It is a quick reminder of the available security commands when you are already working in your server.","u":"{p}antinuke help","ex":["{p}antinuke help"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":[],"st":[],"a":["commands","cmds"],"k":[],"i":"This displays the Antinuke command reference inside Discord. It is a quick reminder of the available security commands when you are already working in your server.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke logs","c":"Antinuke","d":"This selects the text channel where Antinuke should post security alerts. A dedicated private staff channel makes it easier for trusted moderators to review alerts without filling public chat with security messages.","u":"{p}antinuke logs [channel]","ex":["{p}antinuke logs #security-logs"],"ar":[["channel (optional)","The channel. Mention it (#general) or paste its ID."]],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":[],"st":["Make a private channel for staff.","Type the command and mention the channel."],"a":["log"],"k":[],"i":"This selects the text channel where Antinuke should post security alerts. A dedicated private staff channel makes it easier for trusted moderators to review alerts without filling public chat with security messages.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke unwl","c":"Antinuke","d":"This removes a member, bot, or role from the Antinuke trusted list. Once removed, that target is no longer treated as approved for the whitelist permissions they previously had, so the enabled protection rules can apply normally.","u":"{p}antinuke unwl [target]","ex":["{p}antinuke unwl @Ahmed"],"ar":[["target (optional)","The person. Mention them (@Ahmed) or paste their user ID (123456789012345678)."]],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":[],"st":["Type the command and mention the target."],"a":["unwhitelist"],"k":[],"i":"This removes a member, bot, or role from the Antinuke trusted list. Once removed, that target is no longer treated as approved for the whitelist permissions they previously had, so the enabled protection rules can apply normally.","h":"Removing a target from the whitelist withdraws its approved exceptions. The target’s normal Discord permissions do not change; instead, Antinuke no longer treats it as trusted for the selected whitelist actions.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke wizard","c":"Antinuke","d":"This opens the quick-start setup for Antinuke and enables the preset set of protection filters supported by the wizard. It is useful when you want a broad starting configuration instead of opening every filter one by one; you can review and adjust the selections later.","u":"{p}antinuke wizard","ex":["{p}antinuke wizard"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["You can still change filters later with {p}antinuke filters."],"st":["First run {p}antinuke enable.","Type {p}antinuke wizard."],"a":[],"k":[],"i":"This opens the quick-start setup for Antinuke and enables the preset set of protection filters supported by the wizard. It is useful when you want a broad starting configuration instead of opening every filter one by one; you can review and adjust the selections later.","h":"Antinuke uses the protection areas selected by the server owner and extra owners. It watches important server activity covered by those settings and can respond when activity is considered dangerous. Alerts are sent to the security-log channel when one is configured. This guide explains the outcome without publishing exact detection thresholds or internal response logic.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke wl","c":"Antinuke","d":"WL means Whitelist. This command lets you mark a specific member, bot, or role as trusted for selected Antinuke actions.","u":"{p}antinuke wl [target]","ex":["{p}antinuke wl @Ahmed  → trust a person","{p}antinuke wl @SomeBot  → trust a bot","{p}antinuke wl @Moderator  → trust a whole role"],"ar":[["target (optional)","The person. Mention them (@Ahmed) or paste their user ID (123456789012345678)."]],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["Only whitelist people you really trust. If their account is hacked, the hacker gets the same power.","Even a trusted person is stopped if they ban, kick or prune more than 20 members in 6 hours.","Remove someone with {p}antinuke unwl."],"st":["Type the command with a user, a bot or a role.","A panel opens with one button for each action (Ban, Kick, Prune…).","Turn ON only the actions this person is allowed to do. Green means allowed."],"a":["whitelist"],"k":[],"i":"WL means Whitelist. This command lets you mark a specific member, bot, or role as trusted for selected Antinuke actions. A permission panel lets you choose what that target is allowed to do without being treated like an unapproved actor for those selected actions.","h":"The whitelist is an exception list, not a replacement for Discord permissions. You choose a member, bot, or role, then select which Antinuke action categories that target is trusted to perform. This helps approved moderators do their jobs while the enabled protection rules continue to cover activity outside those approved exceptions.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, your head moderator may need to ban members but should not be trusted to change channels. Add that moderator and approve only the actions required for their staff role. The whitelist does not grant them the underlying Discord permission; it records which existing actions Antinuke should treat as trusted.","sec":true},{"n":"antinuke wlist","c":"Antinuke","d":"This displays the server’s current Antinuke whitelist. It helps the owner and extra owners review which people, bots, and roles have been trusted, so old or unnecessary access can be spotted and removed.","u":"{p}antinuke wlist","ex":["{p}antinuke wlist"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":[],"st":["Type {p}antinuke wlist."],"a":["whitelisted"],"k":[],"i":"This displays the server’s current Antinuke whitelist. It helps the owner and extra owners review which people, bots, and roles have been trusted, so old or unnecessary access can be spotted and removed.","h":"The list is a review screen for trusted entries. Use it to confirm that access is still appropriate after staff changes, bot removals, or role reorganizations. Remove entries that no longer need to be trusted.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"antinuke wlreset","c":"Antinuke","d":"This clears the Antinuke whitelist for the server. All previously trusted entries are removed, so the enabled Antinuke rules can evaluate activity without those whitelist exceptions.","u":"{p}antinuke wlreset","ex":["{p}antinuke wlreset"],"ar":[],"w":"Only the server owner or an extra owner can use Antinuke commands.","nt":["Use it if you do not trust the list anymore."],"st":["Type {p}antinuke wlreset."],"a":[],"k":[],"i":"This clears the Antinuke whitelist for the server. All previously trusted entries are removed, so the enabled Antinuke rules can evaluate activity without those whitelist exceptions. Review this carefully before using it on a server with several staff members or bots.","h":"This removes all whitelist exceptions at once. After the reset, enabled Antinuke protection applies without the previous trusted-entry exemptions. It does not change members’ Discord roles or permissions.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a server owner can enable the protection feature, choose the areas that matter to the community, and direct alerts to a private staff channel. Trusted moderators can be approved for only the actions they genuinely need.","sec":true},{"n":"extraowner","c":"Antinuke","d":"An Extra Owner is a trusted person who can manage the server’s Antinuke settings and whitelist through this bot. This command lets the server owner add, view, or remove those delegates; it does not transfer ownership of the Discord server itself.","u":"{p}extraowner [option] [user]","ex":["{p}extraowner set @Ahmed","{p}extraowner view","{p}extraowner reset @Ahmed","{p}extraowner clear"],"ar":[["option (optional)","Some text. Type it after the command."],["user (optional)","The person. Mention them (@Ahmed) or paste their user ID (123456789012345678)."]],"w":"Only the server owner or an extra owner","nt":["Only the server owner can add or remove extra owners."],"st":["Use set to add one, view to see them, reset to remove one, clear to remove all."],"a":["owner","eo"],"k":[],"i":"An Extra Owner is a trusted person who can manage the server’s Antinuke settings and whitelist through this bot. This command lets the server owner add, view, or remove those delegates; it does not transfer ownership of the Discord server itself.","h":"An extra owner can manage Antinuke and its whitelist, so this is a high-trust delegation. Choose someone who already has a strong reason to manage server security, and remove their access when they no longer need it.","v":"Use this when the server needs an additional layer of protection around important administrative activity. Keep the configuration limited to the trusted people who manage security, and review the filters and whitelist whenever staff access changes.","sc":"For example, a co-owner who regularly maintains server security can be added as an extra owner. Do not add ordinary moderators or bots just for convenience, because this role can manage security settings and trusted access.","sec":true},{"n":"autoreact","c":"Auto React","d":"AutoReact lets staff create automatic emoji reactions for messages. A rule can watch for a chosen word or phrase, or it can apply one emoji to every message in a selected channel.","u":"{p}autoreact","ex":["{p}autoreact","{p}arc add <trigger> <emoji>  → React when message contains trigger","{p}arc channel <#ch> <emoji>  → React to all messages in channel","{p}arc remove <trigger>  → Remove trigger-based autoreact","{p}arc removechannel <#ch> <emoji>  → Remove channel-based"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":["arc"],"k":["autoreact add","autoreact channel","autoreact clear","autoreact list","autoreact remove","autoreact removechannel"],"i":"AutoReact lets staff create automatic emoji reactions for messages. A rule can watch for a chosen word or phrase, or it can apply one emoji to every message in a selected channel. The command opens the feature’s command guide so staff can add, review, and remove these rules.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, set the word “solved” to receive a ✅ reaction. When a member writes “The issue is solved now”, the bot can add ✅ automatically. A channel-wide rule can instead react to every new post in #introductions.","sec":false},{"n":"autoreact add","c":"Auto React","d":"This saves a trigger-and-emoji rule. When a new message in the server contains the trigger text, the bot attempts to add the chosen emoji to that message.","u":"{p}autoreact add <trigger> <emoji>","ex":["{p}autoreact add solved ✅","{p}autoreact add welcome 👋"],"ar":[["trigger","Some text. Type it after the command."],["emoji","Some text. Type it after the command."]],"w":"You need: Manage Messages","nt":[],"st":[],"a":[],"k":[],"i":"This saves a trigger-and-emoji rule. When a new message in the server contains the trigger text, the bot attempts to add the chosen emoji to that message. The match is not limited to a message that contains only that word; the trigger can appear within a longer message.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, `{p}autoreact add solved ✅` creates a rule so a message such as “This is solved, thanks!” receives ✅. Use a real Unicode or server emoji; a plain word is not an emoji.","sec":false},{"n":"autoreact channel","c":"Auto React","d":"This saves a channel-wide reaction rule. The bot adds the selected emoji to messages posted in the chosen text channel, without needing a particular word or phrase in each message.","u":"{p}autoreact channel <channel> <emoji>","ex":["{p}autoreact channel #introductions 👋","{p}autoreact channel #feedback ✅"],"ar":[["channel","The channel. Mention it (#general) or paste its ID."],["emoji","Some text. Type it after the command."]],"w":"You need: Manage Messages","nt":[],"st":[],"a":["ch"],"k":[],"i":"This saves a channel-wide reaction rule. The bot adds the selected emoji to messages posted in the chosen text channel, without needing a particular word or phrase in each message. It is useful for a feedback, introduction, or announcement channel where every post should receive the same reaction.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, `{p}autoreact channel #introductions 👋` adds 👋 to new messages in #introductions. This is useful when every introduction should receive the same friendly acknowledgement.","sec":false},{"n":"autoreact clear","c":"Auto React","d":"This removes every saved AutoReact rule for the server, including trigger-based rules and channel-wide reactions. It is a full reset of this feature, not just a temporary pause, so only use it when you really want to remove all configured reactions.","u":"{p}autoreact clear","ex":["{p}autoreact clear"],"ar":[],"w":"You need: Administrator","nt":["This is a big action. Read it twice before you press enter."],"st":[],"a":[],"k":[],"i":"This removes every saved AutoReact rule for the server, including trigger-based rules and channel-wide reactions. It is a full reset of this feature, not just a temporary pause, so only use it when you really want to remove all configured reactions.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, set the word “solved” to receive a ✅ reaction. When a member writes “The issue is solved now”, the bot can add ✅ automatically. A channel-wide rule can instead react to every new post in #introductions.","sec":false},{"n":"autoreact list","c":"Auto React","d":"This shows the AutoReact rules currently saved for the server. You can review both keyword or phrase triggers and channel-wide emoji rules before deciding whether to keep, change, or remove them.","u":"{p}autoreact list","ex":["{p}autoreact list"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":["show"],"k":[],"i":"This shows the AutoReact rules currently saved for the server. You can review both keyword or phrase triggers and channel-wide emoji rules before deciding whether to keep, change, or remove them.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, set the word “solved” to receive a ✅ reaction. When a member writes “The issue is solved now”, the bot can add ✅ automatically. A channel-wide rule can instead react to every new post in #introductions.","sec":false},{"n":"autoreact remove","c":"Auto React","d":"This deletes the trigger-based AutoReact rule for the exact trigger text you provide. It stops the bot from adding that rule’s emoji when future messages contain that trigger; other saved triggers and channel rules remain unchanged.","u":"{p}autoreact remove <trigger>","ex":["{p}autoreact remove solved","{p}autoreact remove welcome"],"ar":[["trigger","Some text. Type it after the command."]],"w":"You need: Manage Messages","nt":[],"st":[],"a":["rm"],"k":[],"i":"This deletes the trigger-based AutoReact rule for the exact trigger text you provide. It stops the bot from adding that rule’s emoji when future messages contain that trigger; other saved triggers and channel rules remain unchanged.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, set the word “solved” to receive a ✅ reaction. When a member writes “The issue is solved now”, the bot can add ✅ automatically. A channel-wide rule can instead react to every new post in #introductions.","sec":false},{"n":"autoreact removechannel","c":"Auto React","d":"This removes the selected emoji rule from a specific channel. It does not clear other reactions configured for that channel or any trigger-based AutoReact rules elsewhere in the server.","u":"{p}autoreact removechannel <channel> <emoji>","ex":["{p}autoreact removechannel #introductions 👋"],"ar":[["channel","The channel. Mention it (#general) or paste its ID."],["emoji","Some text. Type it after the command."]],"w":"You need: Manage Messages","nt":[],"st":[],"a":["rmch"],"k":[],"i":"This removes the selected emoji rule from a specific channel. It does not clear other reactions configured for that channel or any trigger-based AutoReact rules elsewhere in the server.","h":"The bot checks new messages from members against the AutoReact rules saved for this server. A matching trigger adds its chosen emoji; a channel-wide rule adds its emoji to messages in that channel. The rules are saved separately for each server and can be reviewed or removed at any time.","v":"It reduces repetitive staff work and gives members consistent visual feedback. A well-chosen reaction can acknowledge an introduction, mark a completed task, or make a channel feel more interactive.","sc":"For example, set the word “solved” to receive a ✅ reaction. When a member writes “The issue is solved now”, the bot can add ✅ automatically. A channel-wide rule can instead react to every new post in #introductions.","sec":false},{"n":"autoresponder","c":"Auto Responder","d":"AutoResponder lets the server send a saved reply when a member posts a message that matches a trigger. Staff can choose an exact-message match, a phrase found anywhere in a message, or a message that starts with the trigger.","u":"{p}autoresponder","ex":["{p}autoresponder","{p}ar add <trigger> | <response>  → Add (exact match)","{p}ar addcontains <trigger> | <response>  → Triggers if msg contains text","{p}ar addstart <trigger> | <response>  → Triggers on startswith","{p}ar remove <trigger>  → Remove an autoresponse"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":["ar","autoresponse"],"k":["autoresponder add","autoresponder addcontains","autoresponder addstart","autoresponder clear","autoresponder list","autoresponder remove"],"i":"AutoResponder lets the server send a saved reply when a member posts a message that matches a trigger. Staff can choose an exact-message match, a phrase found anywhere in a message, or a message that starts with the trigger. Responses can also use simple user, server, and channel variables.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, create a reply for “server rules” that points members to the rules channel. A contains rule can also respond when someone writes “Where can I find the server rules?” rather than requiring the exact phrase alone.","sec":false},{"n":"autoresponder add","c":"Auto Responder","d":"This creates an exact-match auto reply. The bot compares a member’s complete message with the trigger; when they match, it sends the saved response in the same channel.","u":"{p}autoresponder add <args>","ex":["{p}ar add rules | Please read #rules before chatting.","{p}ar add hello | Welcome to the server!"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":[],"k":[],"i":"This creates an exact-match auto reply. The bot compares a member’s complete message with the trigger; when they match, it sends the saved response in the same channel. Use this for short questions that should have one predictable answer, such as a rules or support prompt.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, `{p}ar add rules | Please read <#123456789012345678> before chatting.` replies only when the complete message is “rules”. Use addcontains when the trigger should match inside a longer sentence.","sec":false},{"n":"autoresponder addcontains","c":"Auto Responder","d":"This creates a reply rule that matches when the trigger appears anywhere inside a message. Members can write a longer sentence and still receive the saved answer, which is useful for common keywords such as “website”, “rules”, or “support”.","u":"{p}autoresponder addcontains <args>","ex":["{p}ar addcontains support | Please open a ticket in #support.","{p}ar addcontains website | Visit our official website for more information."],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":[],"k":[],"i":"This creates a reply rule that matches when the trigger appears anywhere inside a message. Members can write a longer sentence and still receive the saved answer, which is useful for common keywords such as “website”, “rules”, or “support”.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, `{p}ar addcontains support | Open a ticket in <#123456789012345678> and our team will help.` can reply when a member writes “I need support with my account”.","sec":false},{"n":"autoresponder addstart","c":"Auto Responder","d":"This creates a reply rule that matches messages beginning with the trigger text. It is useful when you want a standard phrase or command-like opening to trigger a response, without matching messages where the same words appear only in the middle.","u":"{p}autoresponder addstart <args>","ex":["{p}ar addstart !help | Choose a topic from the help panel.","{p}ar addstart !ticket | Please use the ticket panel in #support."],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":[],"k":[],"i":"This creates a reply rule that matches messages beginning with the trigger text. It is useful when you want a standard phrase or command-like opening to trigger a response, without matching messages where the same words appear only in the middle.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, `{p}ar addstart !help | Choose a topic from the help panel.` can reply to messages beginning with `!help`, while not matching a message where `!help` appears only at the end.","sec":false},{"n":"autoresponder clear","c":"Auto Responder","d":"This deletes every saved AutoResponder rule for the server. Existing replies will stop being sent because their trigger-and-response entries are removed; use the list command first if you need to review what is configured.","u":"{p}autoresponder clear","ex":["{p}autoresponder clear"],"ar":[],"w":"You need: Administrator","nt":["This is a big action. Read it twice before you press enter."],"st":[],"a":[],"k":[],"i":"This deletes every saved AutoResponder rule for the server. Existing replies will stop being sent because their trigger-and-response entries are removed; use the list command first if you need to review what is configured.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, create a reply for “server rules” that points members to the rules channel. A contains rule can also respond when someone writes “Where can I find the server rules?” rather than requiring the exact phrase alone.","sec":false},{"n":"autoresponder list","c":"Auto Responder","d":"This displays the saved AutoResponder triggers, their replies, and the matching style used by each rule. It helps staff audit the response library and check whether a rule is exact, contains-based, or starts-with.","u":"{p}autoresponder list","ex":["{p}autoresponder list"],"ar":[],"w":"You need: Manage Messages","nt":[],"st":[],"a":["show"],"k":[],"i":"This displays the saved AutoResponder triggers, their replies, and the matching style used by each rule. It helps staff audit the response library and check whether a rule is exact, contains-based, or starts-with.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, create a reply for “server rules” that points members to the rules channel. A contains rule can also respond when someone writes “Where can I find the server rules?” rather than requiring the exact phrase alone.","sec":false},{"n":"autoresponder remove","c":"Auto Responder","d":"This deletes the saved response linked to the trigger text you provide. Other response rules are not affected, so you can retire an outdated answer without rebuilding the whole AutoResponder setup.","u":"{p}autoresponder remove <trigger>","ex":["{p}ar remove rules","{p}ar remove support"],"ar":[["trigger","Some text. Type it after the command."]],"w":"You need: Manage Messages","nt":[],"st":[],"a":["rm","delete"],"k":[],"i":"This deletes the saved response linked to the trigger text you provide. Other response rules are not affected, so you can retire an outdated answer without rebuilding the whole AutoResponder setup.","h":"The bot checks new member messages against the response rules saved for this server. When a rule matches, it posts that rule’s reply in the same channel and fills supported placeholders such as the member name, server name, and channel mention. It stops after the first matching response.","v":"It saves moderators from repeatedly typing the same information. Common questions can receive a consistent answer at any time, even when staff are offline.","sc":"For example, create a reply for “server rules” that points members to the rules channel. A contains rule can also respond when someone writes “Where can I find the server rules?” rather than requiring the exact phrase alone.","sec":false},{"n":"autorole","c":"Auto Role","d":"AutoRole assigns a configured role automatically when a new member joins the server. Human accounts and bot accounts have separate lists, which lets administrators give newcomers and newly added bots different starter roles.","u":"{p}autorole","ex":["{p}autorole","{p}autorole humans add <role>  → Add human autorole","{p}autorole humans remove <role>  → Remove human autorole","{p}autorole humans list  → List human autoroles","{p}autorole bots add <role>  → Add bot autorole"],"ar":[],"w":"You need: Administrator","nt":[],"st":[],"a":["autoroles"],"k":["autorole bots","autorole humans"],"i":"AutoRole assigns a configured role automatically when a new member joins the server. Human accounts and bot accounts have separate lists, which lets administrators give newcomers and newly added bots different starter roles.","h":"When a member joins, the bot checks whether the account is a human or a bot and looks up the matching AutoRole list. It then attempts to assign the configured roles. The bot’s role must be high enough in the Discord role list, and it needs permission to manage roles.","v":"It gives new members the right starting role immediately and keeps bot accounts separate from human accounts. This makes onboarding more consistent and reduces manual role assignments.","sc":"For example, add @Member to the human list and @Bot to the bot list. The next person who joins receives the member role, while a newly added bot receives the separate bot role.","sec":false},{"n":"autorole bots","c":"Auto Role","d":"This opens the bot-member AutoRole group. Its commands let administrators add, remove, and review the roles that should be assigned when a bot account joins the server.","u":"{p}autorole bots","ex":["{p}autorole bots","{p}autorole bots add <role>  → Add bot autorole","{p}autorole bots remove <role>  → Remove bot autorole","{p}autorole bots list  → List bot autoroles"],"ar":[],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":["autorole bots add","autorole bots list","autorole bots remove"],"i":"This opens the bot-member AutoRole group. Its commands let administrators add, remove, and review the roles that should be assigned when a bot account joins the server.","h":"When a member joins, the bot checks whether the account is a human or a bot and looks up the matching AutoRole list. It then attempts to assign the configured roles. The bot’s role must be high enough in the Discord role list, and it needs permission to manage roles.","v":"It gives new members the right starting role immediately and keeps bot accounts separate from human accounts. This makes onboarding more consistent and reduces manual role assignments.","sc":"For example, add @Member to the human list and @Bot to the bot list. The next person who joins receives the member role, while a newly added bot receives the separate bot role.","sec":false},{"n":"autorole bots add","c":"Auto Role","d":"This adds a role to the bot AutoRole list. From then on, when a bot account joins the server, the configured role is assigned automatically if the bot has the hierarchy and permission access needed to assign it.","u":"{p}autorole bots add <role>","ex":["{p}autorole bots add @Bots"],"ar":[["role","The role. Mention it (@Member) or type its name."]],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This adds a role to the bot AutoRole list. From then on, when a bot account joins the server, the configured role is assigned automatically if the bot has the hierarchy and permission access needed to assign it.","h":"When a member joins, the bot checks whether the account is a human or a bot and looks up the matching AutoRole list. It then attempts to assign the configured roles. The bot’s role must be high enough in the Discord role list, and it needs permission to manage roles.","v":"It gives new members the right starting role immediately and keeps bot accounts separate from human accounts. This makes onboarding more consistent and reduces manual role assignments.","sc":"For example, add @Member to the human list and @Bot to the bot list. The next person who joins receives the member role, while a newly added bot receives the separate bot role.","sec":false},{"n":"autorole bots list","c":"Auto Role","d":"This shows the roles configured for newly joined bot accounts. It lets administrators check which role or roles the bot will attempt to assign to bots in the future.","u":"{p}autorole bots list","ex":["{p}autorole bots list"],"ar":[],"w":"You need: Administrator","nt":[],"st":[],"a":["show"],"k":[],"i":"This shows the roles configured for newly joined bot accounts. It lets administrators check which role or roles the bot will attempt to assign to bots in the future.","h":"When a member joins, the bot checks whether the account is a human or a bot and looks up the matching AutoRole list. It then attempts to assign the configured roles. The bot’s role must be high enough in the Discord role list, and it needs permission to manage roles.","v":"It gives new members the right starting role immediately and keeps bot accounts separate from human accounts. This makes onboarding more consistent and reduces manual role assignments.","sc":"For example, add @Member to the human list and @Bot to the bot list. The next person who joins receives the member role, while a newly added bot receives the separate bot role.","sec":false},{"n":"autorole bots remove","c":"Auto Role","d":"This removes a role from the bot AutoRole list. New bot accounts will no longer receive that role automatically, while other configured bot roles and the human AutoRole list remain unchanged.","u":"{p}autorole bots remove <role>","ex":["{p}autorole bots remove @Member","{p}autorole bots remove <role>  → Remove bot autorole"],"ar":[["role","The role. Mention it (@Member) or type its name."]],"w":"You need: Administrator","nt":[],"st":[],"a":[],"k":[],"i":"This removes a role from the bot AutoRole list. New bot accounts will no longer receive that role automatically, while other configured bot roles and the human AutoRole list remain unchanged.","h":"When a member joins, the bot checks whether the account is a human or a bot and looks up the matching AutoRole list. It then attempts to assign the configured roles. The bot’s role must be high enough in the Discord role list, and it needs permission to manage roles.","v":"It gives new members the right starting role immediately and keeps bot accounts separate from human accounts. This makes onboarding more consistent and reduces manual role assignments.","sc":"For example, add @Member to the human list and @Bot to the bot list. The next person who joins receives the member role, while a newly added bot receives the separate bot role.","sec":false},{"n":"autorole humans","c":"Auto Role","d":"This opens the human-member AutoRole group. Its commands manage the roles that shou
